!======================================================================
! Device : Switch5
! Role   : Core switch, block C (STP root, PAgP "auto" side)
! Uplink: vIOS3 Gi0/2
! Po1 -> Switch9, Po2 -> Switch10
! Load   : enable -> configure terminal -> paste -> end -> write memory
!======================================================================
!
!
! ---- Basics, credentials and SSH ---------------------------------
hostname Switch5
ip domain-name test
no ip http server
no ip http secure-server
! Lab credentials only - change them outside the lab.
enable algorithm-type sha256 secret LabPass123
username admin privilege 15 algorithm-type sha256 secret LabPass123
! SSH v2 needs an RSA key. Create it once:  crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
! ---- VLANs (not saved in "show run" on IOSvL2, so defined explicitly) --
vlan 10
 name USERS-10
vlan 20
 name USERS-20
vlan 30
 name MGMT
!
! ---- Spanning tree: this switch is the root for every VLAN -------
spanning-tree mode pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,30 priority 24576
!
! ---- EtherChannel (PAgP "auto" waits for the edge switch, which uses "desirable") --
interface Port-channel1
 description Switch9
 switchport trunk encapsulation dot1q
 switchport mode trunk
interface Port-channel2
 description Switch10
 switchport trunk encapsulation dot1q
 switchport mode trunk
interface GigabitEthernet0/1
 description Switch9
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode auto non-silent
interface GigabitEthernet0/2
 description Switch9
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode auto non-silent
interface GigabitEthernet0/3
 description Switch10
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode auto non-silent
interface GigabitEthernet1/0
 description Switch10
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode auto non-silent
!
! ---- Uplink trunk to the router (router-on-a-stick) --------------
interface GigabitEthernet0/0
 description vIOS3 Gi0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
! ---- Management (VLAN 30) ----------------------------------------
interface Vlan30
 description MGMT
 ip address 172.20.16.162 255.255.255.248
 no shutdown
ip default-gateway 172.20.16.161
!
end
