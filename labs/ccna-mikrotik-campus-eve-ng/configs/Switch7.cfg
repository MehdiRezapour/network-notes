!======================================================================
! Device : Switch7
! Role   : Access switch, block D (PAgP "desirable" side)
! Uplink: Switch6
! Load   : enable -> configure terminal -> paste -> end -> write memory
!======================================================================
!
!
! ---- Basics, credentials and SSH ---------------------------------
hostname Switch7
ip domain-name test
no ip http server
no ip http secure-server
! Lab credentials only - change them outside the lab.
enable algorithm-type sha256 secret LabPass123
username admin privilege 15 algorithm-type sha256 secret LabPass123
! SSH v2 needs an RSA key. Create it once:  crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
! ---- VLANs (not saved in "show run" on IOSvL2, so defined explicitly) --
vlan 10
 name USERS-10
vlan 20
 name USERS-20
vlan 30
 name MGMT
!
! ---- Auto-recover ports that were err-disabled -------------------
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery interval 30
!
! ---- Spanning tree (the core switch is the root) -----------------
spanning-tree mode pvst
spanning-tree extend system-id
!
! ---- Uplink EtherChannel Po1 to Switch6 --------------------------
interface Port-channel1
 description Switch6
 switchport trunk encapsulation dot1q
 switchport mode trunk
interface GigabitEthernet0/0
 description Switch6
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode desirable non-silent
interface GigabitEthernet0/1
 description Switch6
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode desirable non-silent
!
! ---- Access ports: VLAN + port-security + PortFast + BPDU guard --
interface GigabitEthernet0/2
 description Host (VLAN 10)
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast edge
 spanning-tree bpduguard enable
interface GigabitEthernet0/3
 description Host (VLAN 20)
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast edge
 spanning-tree bpduguard enable
interface GigabitEthernet1/0
 description Host (VLAN 10)
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast edge
 spanning-tree bpduguard enable
interface GigabitEthernet1/1
 description Host (VLAN 20)
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
! ---- Management (VLAN 30) ----------------------------------------
interface Vlan30
 description MGMT
 ip address 172.20.16.227 255.255.255.248
 no shutdown
ip default-gateway 172.20.16.225
!
end
