!======================================================================
! Device : vIOS4
! Role   : IOSv router, block D gateway (router-on-a-stick)
! Trunk to Switch6 Gi0/0
! Load   : enable -> configure terminal -> paste -> end -> write memory
!======================================================================
!
!
! ---- Basics, credentials and SSH ---------------------------------
hostname vIOS4
ip domain-name test
no ip http server
no ip http secure-server
! Lab credentials only - change them outside the lab.
enable algorithm-type sha256 secret LabPass123
username admin privilege 15 algorithm-type sha256 secret LabPass123
! SSH v2 needs an RSA key. Create it once:  crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
! ---- DHCP for the user VLANs (gateway addresses are excluded) ----
ip dhcp excluded-address 172.20.16.193
ip dhcp excluded-address 172.20.16.209
ip dhcp pool VLAN10
 network 172.20.16.192 255.255.255.240
 default-router 172.20.16.193
 dns-server 8.8.8.8
ip dhcp pool VLAN20
 network 172.20.16.208 255.255.255.240
 default-router 172.20.16.209
 dns-server 8.8.8.8
!
! ---- Router-to-router links --------------------------------------
interface GigabitEthernet0/0
 description Link to vIOS3 Gi0/1 (10.16.34.0/24)
 ip address 10.16.34.2 255.255.255.0
 no shutdown
!
! ---- Router-on-a-stick sub-interfaces ----------------------------
interface GigabitEthernet0/1
 description Trunk to switch
 no shutdown
interface GigabitEthernet0/1.10
 description VLAN 10 gateway
 encapsulation dot1Q 10
 ip address 172.20.16.193 255.255.255.240
interface GigabitEthernet0/1.20
 description VLAN 20 gateway
 encapsulation dot1Q 20
 ip address 172.20.16.209 255.255.255.240
interface GigabitEthernet0/1.30
 description VLAN 30 management gateway
 encapsulation dot1Q 30
 ip address 172.20.16.225 255.255.255.248
!
! ---- Static routing ----------------------------------------------
! Everything else goes through vIOS3
ip route 0.0.0.0 0.0.0.0 10.16.34.1
!
end
